name: Build & Release Desktop Apps (DMG & EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Build macOS DMG
        run: |
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: Upload macOS DMG to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/HermesBookTranslator-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "HermesBookTranslator" app.py
          cd dist
          powershell Compress-Archive -Path HermesBookTranslator.exe -DestinationPath HermesBookTranslator-Windows-EXE.zip

      - name: Upload Windows EXE to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/HermesBookTranslator.exe
            dist/HermesBookTranslator-Windows-EXE.zip
